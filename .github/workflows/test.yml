# ABOUTME: CI for the plugins — the codex execute engine on Linux and macOS, the grok node suite, and the feature hooks.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  codex-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:codex
  codex-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install coreutils
      - run: sudo ln -sf "$(which gtimeout)" /usr/local/bin/timeout || ln -sf "$(which gtimeout)" "$(brew --prefix)/bin/timeout"
      - run: npm run test:codex
  grok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:grok
  feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: plugins/feature/hooks/tests/run.sh
