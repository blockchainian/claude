# ABOUTME: CI for the plugins — the codex-manager node suite, the marketplace manifest suite, and the feature hooks and ship scripts.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:codex
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:marketplace
  feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:feature
