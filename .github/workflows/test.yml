# ABOUTME: CI for the plugins — the codex-manager node suite, the marketplace manifest suite, and the feature ship scripts.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl -fsSL "$release/$archive" -o "$archive"
          curl -fsSL "$release/gitleaks_${version}_checksums.txt" -o checksums.txt
          awk -v archive="$archive" '$2 == archive' checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan commits for secrets and home paths
        run: |
          revisions=$(python3 .github/scripts/commit_range.py)
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="--diff-merges=first-parent $revisions"
      - name: Scan added lines for private terms
        if: ${{ !cancelled() }}
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          revisions=$(python3 .github/scripts/commit_range.py)
          python3 .github/scripts/gitleaks-privacy.py git --log-opts="--diff-merges=first-parent $revisions"
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:codex
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:marketplace
  feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: npm run test:feature
